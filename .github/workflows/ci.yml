name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      # Firestore rules + inventory emulator tests need a JDK (firebase-tools ≥14 wants 21+).
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - run: npm ci

      - name: Typecheck (app)
        run: npm run typecheck

      - name: Invariant coverage gate (no silent gaps)
        run: npm run check:coverage

      - name: Unit tests (pure)
        run: |
          npm run test:reconcile-plan
          npm run test:inventory-invariants
          npm run test:inventory-validation
          npm run test:inventory-detection
          npm run test:inventory-discovery
          npm run test:inventory-parity
          npm run test:ledger-ids

      - name: Rules tests (emulator)
        run: npm run test:rules:all

      - name: Inventory integration tests (emulator)
        run: |
          npm run test:inventory-reconcile
          npm run test:inventory-run
          npm run test:inventory-api
          npm run test:integration
